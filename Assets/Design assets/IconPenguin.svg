<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Pixel penguin head for TODAY.TXT — hard edges, drawn on transparent. -->
  <!-- head -->
  <rect x="10" y="6"  width="44" height="50" fill="#000000"/>
  <rect x="12" y="8"  width="40" height="46" fill="#26262e"/>
  <rect x="12" y="8"  width="40" height="3"  fill="#3c3c46"/>
  <!-- white face -->
  <rect x="18" y="20" width="28" height="28" fill="#f4f4f0"/>
  <rect x="20" y="16" width="24" height="4"  fill="#f4f4f0"/>
  <!-- eyes -->
  <rect x="22" y="24" width="5" height="7" fill="#000000"/>
  <rect x="37" y="24" width="5" height="7" fill="#000000"/>
  <!-- beak -->
  <rect x="27" y="33" width="10" height="10" fill="#000000"/>
  <rect x="29" y="35" width="6"  height="6"  fill="#e8923a"/>
</svg>
