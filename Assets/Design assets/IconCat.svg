<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Pixel cat head for TODAY.TXT — hard edges, drawn on transparent. -->
  <!-- pointy ears (pixel triangles) -->
  <rect x="12" y="4"  width="8"  height="6" fill="#000000"/>
  <rect x="12" y="10" width="14" height="6" fill="#000000"/>
  <rect x="14" y="6"  width="4"  height="4" fill="#e08890"/>
  <rect x="44" y="4"  width="8"  height="6" fill="#000000"/>
  <rect x="38" y="10" width="14" height="6" fill="#000000"/>
  <rect x="46" y="6"  width="4"  height="4" fill="#e08890"/>
  <!-- head -->
  <rect x="10" y="14" width="44" height="38" fill="#000000"/>
  <rect x="12" y="16" width="40" height="34" fill="#e8923a"/>
  <!-- tabby stripes -->
  <rect x="20" y="16" width="4" height="6" fill="#c46f1e"/>
  <rect x="30" y="16" width="4" height="8" fill="#c46f1e"/>
  <rect x="40" y="16" width="4" height="6" fill="#c46f1e"/>
  <!-- eyes -->
  <rect x="20" y="28" width="5" height="7" fill="#000000"/>
  <rect x="39" y="28" width="5" height="7" fill="#000000"/>
  <!-- muzzle -->
  <rect x="24" y="37" width="16" height="11" fill="#fff8ee"/>
  <!-- nose + mouth -->
  <rect x="29" y="37" width="6" height="4" fill="#d96a8a"/>
  <rect x="31" y="41" width="2" height="4" fill="#000000"/>
  <!-- whiskers -->
  <rect x="2"  y="34" width="8" height="2" fill="#000000"/>
  <rect x="2"  y="40" width="8" height="2" fill="#000000"/>
  <rect x="54" y="34" width="8" height="2" fill="#000000"/>
  <rect x="54" y="40" width="8" height="2" fill="#000000"/>
</svg>
