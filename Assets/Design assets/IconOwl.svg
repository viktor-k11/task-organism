<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Pixel owl head for TODAY.TXT — hard edges, drawn on transparent. -->
  <!-- ear tufts -->
  <rect x="10" y="4" width="10" height="10" fill="#000000"/>
  <rect x="12" y="6" width="6"  height="6"  fill="#8a5a2e"/>
  <rect x="44" y="4" width="10" height="10" fill="#000000"/>
  <rect x="46" y="6" width="6"  height="6"  fill="#8a5a2e"/>
  <!-- head -->
  <rect x="8"  y="10" width="48" height="46" fill="#000000"/>
  <rect x="10" y="12" width="44" height="42" fill="#8a5a2e"/>
  <!-- eye rings -->
  <rect x="12" y="18" width="20" height="20" fill="#000000"/>
  <rect x="32" y="18" width="20" height="20" fill="#000000"/>
  <rect x="14" y="20" width="16" height="16" fill="#f4ead8"/>
  <rect x="34" y="20" width="16" height="16" fill="#f4ead8"/>
  <!-- irises + pupils -->
  <rect x="18" y="24" width="8" height="8" fill="#f0b428"/>
  <rect x="38" y="24" width="8" height="8" fill="#f0b428"/>
  <rect x="20" y="26" width="4" height="4" fill="#000000"/>
  <rect x="40" y="26" width="4" height="4" fill="#000000"/>
  <!-- beak -->
  <rect x="27" y="38" width="10" height="12" fill="#000000"/>
  <rect x="29" y="40" width="6"  height="8"  fill="#e8923a"/>
</svg>
