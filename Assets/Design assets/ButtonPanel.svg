<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64" shape-rendering="crispEdges">
  <!--
    Retro dialog button. Classic raised bevel: bright top/left, dark
    bottom/right, hard corners.

    The FILL is dark and the bevel is bright, which is the inverse of a
    desktop button — on the additive Specs display a light-grey fill would
    drown the bright label sitting on it. The bevel carries the "button"
    reading instead.
  -->
  <rect x="0" y="0" width="256" height="64" fill="#000000"/>
  <rect x="2" y="2" width="252" height="60" fill="#2a2f33"/>
  <!-- Raised bevel -->
  <rect x="2" y="2" width="252" height="3" fill="#e8e8e8"/>
  <rect x="2" y="2" width="3" height="60" fill="#e8e8e8"/>
  <rect x="2" y="59" width="252" height="3" fill="#6a6a6a"/>
  <rect x="251" y="2" width="3" height="60" fill="#6a6a6a"/>
  <!-- Inner outline, the thin dark line a real bevel leaves -->
  <rect x="6" y="6" width="244" height="1" fill="#4a5054"/>
  <rect x="6" y="6" width="1" height="52" fill="#4a5054"/>
</svg>
