<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Pixel rabbit head for TODAY.TXT — hard edges, drawn on transparent. -->
  <!-- tall ears -->
  <rect x="16" y="2" width="10" height="26" fill="#000000"/>
  <rect x="18" y="4" width="6"  height="22" fill="#d8d2ce"/>
  <rect x="20" y="6" width="2"  height="16" fill="#e8a8b8"/>
  <rect x="38" y="2" width="10" height="26" fill="#000000"/>
  <rect x="40" y="4" width="6"  height="22" fill="#d8d2ce"/>
  <rect x="42" y="6" width="2"  height="16" fill="#e8a8b8"/>
  <!-- head -->
  <rect x="12" y="24" width="40" height="32" fill="#000000"/>
  <rect x="14" y="26" width="36" height="28" fill="#d8d2ce"/>
  <!-- eyes -->
  <rect x="21" y="32" width="5" height="7" fill="#000000"/>
  <rect x="38" y="32" width="5" height="7" fill="#000000"/>
  <!-- nose -->
  <rect x="29" y="39" width="6" height="4" fill="#d96a8a"/>
  <!-- buck teeth -->
  <rect x="26" y="43" width="12" height="10" fill="#000000"/>
  <rect x="28" y="45" width="8"  height="6"  fill="#ffffff"/>
  <rect x="31" y="45" width="2"  height="6"  fill="#000000"/>
  <!-- whiskers -->
  <rect x="4"  y="36" width="8" height="2" fill="#000000"/>
  <rect x="4"  y="42" width="8" height="2" fill="#000000"/>
  <rect x="52" y="36" width="8" height="2" fill="#000000"/>
  <rect x="52" y="42" width="8" height="2" fill="#000000"/>
</svg>
