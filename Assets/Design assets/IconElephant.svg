<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Pixel elephant head for TODAY.TXT — hard edges, drawn on transparent. -->
  <!-- big ears -->
  <rect x="2"  y="16" width="16" height="30" fill="#000000"/>
  <rect x="4"  y="18" width="12" height="26" fill="#7f868f"/>
  <rect x="46" y="16" width="16" height="30" fill="#000000"/>
  <rect x="48" y="18" width="12" height="26" fill="#7f868f"/>
  <!-- head -->
  <rect x="14" y="10" width="36" height="36" fill="#000000"/>
  <rect x="16" y="12" width="32" height="32" fill="#9aa0a8"/>
  <rect x="16" y="12" width="32" height="3"  fill="#b2b8c0"/>
  <!-- eyes -->
  <rect x="23" y="22" width="4" height="6" fill="#000000"/>
  <rect x="37" y="22" width="4" height="6" fill="#000000"/>
  <!-- tusks -->
  <rect x="18" y="38" width="8" height="12" fill="#000000"/>
  <rect x="20" y="40" width="4" height="8"  fill="#f4f0e4"/>
  <rect x="38" y="38" width="8" height="12" fill="#000000"/>
  <rect x="40" y="40" width="4" height="8"  fill="#f4f0e4"/>
  <!-- trunk -->
  <rect x="27" y="40" width="10" height="20" fill="#000000"/>
  <rect x="29" y="42" width="6"  height="16" fill="#9aa0a8"/>
  <rect x="29" y="54" width="6"  height="2"  fill="#6f767f"/>
</svg>
