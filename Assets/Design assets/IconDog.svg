<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Pixel dog head for TODAY.TXT — same hard-edged retro language as the
       window icons, drawn on transparent. -->
  <!-- floppy ears -->
  <rect x="4"  y="14" width="14" height="28" fill="#000000"/>
  <rect x="6"  y="16" width="10" height="24" fill="#7a4a1e"/>
  <rect x="46" y="14" width="14" height="28" fill="#000000"/>
  <rect x="48" y="16" width="10" height="24" fill="#7a4a1e"/>
  <!-- head -->
  <rect x="14" y="8"  width="36" height="44" fill="#000000"/>
  <rect x="16" y="10" width="32" height="40" fill="#c08a4a"/>
  <rect x="16" y="10" width="32" height="3"  fill="#d9a55f"/>
  <!-- eyes -->
  <rect x="22" y="22" width="5" height="7" fill="#000000"/>
  <rect x="37" y="22" width="5" height="7" fill="#000000"/>
  <!-- muzzle -->
  <rect x="23" y="33" width="18" height="14" fill="#e9c890"/>
  <!-- nose -->
  <rect x="28" y="33" width="8" height="6" fill="#000000"/>
  <!-- mouth + tongue -->
  <rect x="30" y="39" width="4" height="5" fill="#000000"/>
  <rect x="28" y="44" width="8" height="8" fill="#000000"/>
  <rect x="30" y="44" width="4" height="6" fill="#e87a90"/>
</svg>
