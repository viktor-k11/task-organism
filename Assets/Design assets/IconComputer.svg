<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Retro desktop-computer icon for system-message windows. Hard pixel
       edges, 90s beige-grey and blue, drawn on transparent. -->
  <!-- Monitor body -->
  <rect x="10" y="8"  width="44" height="32" fill="#000000"/>
  <rect x="12" y="10" width="40" height="28" fill="#c8c8c0"/>
  <rect x="12" y="10" width="40" height="2"  fill="#ffffff"/>
  <rect x="12" y="10" width="2"  height="28" fill="#ffffff"/>
  <rect x="12" y="36" width="40" height="2"  fill="#808080"/>
  <rect x="50" y="10" width="2"  height="28" fill="#808080"/>
  <!-- Screen -->
  <rect x="16" y="14" width="32" height="20" fill="#000080"/>
  <rect x="20" y="18" width="14" height="9"  fill="#ffffff"/>
  <rect x="26" y="22" width="14" height="9"  fill="#c8c8c0"/>
  <rect x="26" y="22" width="14" height="2"  fill="#ffffff"/>
  <!-- Stand -->
  <rect x="26" y="40" width="12" height="6" fill="#000000"/>
  <rect x="27" y="41" width="10" height="4" fill="#a8a8a0"/>
  <!-- Base -->
  <rect x="10" y="46" width="44" height="10" fill="#000000"/>
  <rect x="12" y="48" width="40" height="6"  fill="#c8c8c0"/>
  <rect x="12" y="48" width="40" height="2"  fill="#ffffff"/>
  <rect x="16" y="51" width="5"  height="2"  fill="#00b000"/>
</svg>
