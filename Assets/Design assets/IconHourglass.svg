<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Retro hourglass, for the timed windows (the closing ritual). The
       classic "wait" cursor, reused here as a calm "take a minute" mark. -->
  <!-- Outer black outline -->
  <rect x="16" y="6"  width="32" height="4" fill="#000000"/>
  <rect x="16" y="54" width="32" height="4" fill="#000000"/>
  <rect x="18" y="10" width="4"  height="6" fill="#000000"/>
  <rect x="42" y="10" width="4"  height="6" fill="#000000"/>
  <rect x="22" y="16" width="4"  height="6" fill="#000000"/>
  <rect x="38" y="16" width="4"  height="6" fill="#000000"/>
  <rect x="26" y="22" width="4"  height="6" fill="#000000"/>
  <rect x="34" y="22" width="4"  height="6" fill="#000000"/>
  <rect x="26" y="36" width="4"  height="6" fill="#000000"/>
  <rect x="34" y="36" width="4"  height="6" fill="#000000"/>
  <rect x="22" y="42" width="4"  height="6" fill="#000000"/>
  <rect x="38" y="42" width="4"  height="6" fill="#000000"/>
  <rect x="18" y="48" width="4"  height="6" fill="#000000"/>
  <rect x="42" y="48" width="4"  height="6" fill="#000000"/>
  <!-- Glass interior -->
  <rect x="22" y="10" width="20" height="6" fill="#ffffff"/>
  <rect x="26" y="16" width="12" height="6" fill="#ffffff"/>
  <rect x="30" y="22" width="4"  height="6" fill="#ffffff"/>
  <rect x="30" y="36" width="4"  height="6" fill="#ffffff"/>
  <rect x="26" y="42" width="12" height="6" fill="#ffffff"/>
  <rect x="22" y="48" width="20" height="6" fill="#ffffff"/>
  <!-- Sand: gathered at the bottom, a little still falling -->
  <rect x="26" y="44" width="12" height="4" fill="#000000"/>
  <rect x="22" y="48" width="20" height="6" fill="#000000"/>
  <rect x="30" y="28" width="4"  height="8" fill="#000000"/>
</svg>
