<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384" shape-rendering="crispEdges">
  <!--
    Retro system-window frame for every dialog (intro, task entry, voice,
    review, completion, TODAY.TXT, ritual). Same language as ReminderPanel:
    bright chrome, blue title bar, hard angles, dark body.

    Stretched to each dialog's size at runtime. Only the bar's THICKNESS
    varies with dialog height — the title text is drawn by the Lens at a
    constant size, so it never distorts.
  -->
  <defs>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a246a"/>
      <stop offset="1" stop-color="#3a6ea5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="384" fill="#000000"/>
  <rect x="3" y="3" width="506" height="378" fill="#c0c0c0"/>
  <rect x="3" y="3" width="506" height="4" fill="#ffffff"/>
  <rect x="3" y="3" width="4" height="378" fill="#ffffff"/>
  <rect x="3" y="377" width="506" height="4" fill="#808080"/>
  <rect x="505" y="3" width="4" height="378" fill="#808080"/>

  <!-- Title bar -->
  <rect x="9" y="9" width="494" height="40" fill="url(#titleBar)"/>

  <!-- No close box: it was decorative only (dialogs are dismissed by their
       buttons), and a control that looks pressable but does nothing reads
       as broken. -->

  <!--
    Body: dark rather than classic light grey. The Specs display is additive,
    so dark reads as transparent and the bright copy on top stays legible;
    a light-grey field would wash the text out entirely.
  -->
  <rect x="14" y="56" width="484" height="318" fill="#23282b"/>
  <rect x="14" y="56" width="484" height="2" fill="#808080"/>
  <rect x="14" y="56" width="2" height="318" fill="#808080"/>
  <rect x="14" y="372" width="484" height="2" fill="#ffffff"/>
  <rect x="496" y="56" width="2" height="318" fill="#ffffff"/>
</svg>
